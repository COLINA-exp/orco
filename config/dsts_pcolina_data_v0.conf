# Shared DST selection for PMAPs made with pmaps_pcolina_data.conf.
# Integral and sensor thresholds are pe; heights are pe/us; gains provisional.
# Both zero counts are allowed because the datasets contain separate pulse types.
# Require s1no >= 0 or s2no >= 0 downstream to exclude all-dummy rows.
s1_min_count        = 0
s1_max_count        = 1
s1_min_width        =  2.3 * microsecond
s1_max_width        = 12.1 * microsecond
s1_min_height       =  90 * pe / microsecond
s1_max_height       = 300 * pe / microsecond
s1_min_integral     = 150 * pe
s1_max_integral     = 800 * pe
s1_threshold        =   1 * pe
s1_min_multiplicity = 0
s1_max_multiplicity = 0 # no FP

s2_min_count        = 0
s2_max_count        = 1
s2_min_width        =  6.0 * microsecond
s2_max_width        = 34.1 * microsecond
s2_min_height       =   180 * pe / microsecond
s2_max_height       =  2000 * pe / microsecond
s2_min_integral     =   800 * pe
s2_max_integral     = 10000 * pe
s2_threshold        =    10 * pe
s2_min_multiplicity = 2
s2_max_multiplicity = 4
