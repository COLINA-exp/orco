detector      = pColina
sampling_time = 16 * nanosecond

s1_min_samples = 1
s1_max_samples = (1 * microsecond) // sampling_time
s1_min_time    =    0 * microsecond
s1_max_time    =    0 * microsecond
s1_threshold   = 5000000
s1_holdon      = 5
s1_padding     = 5

s2_min_samples = (1.1 * microsecond) // sampling_time
s2_max_samples = (1.0 * millisecond) // sampling_time
s2_min_time    =    0 * microsecond
s2_max_time    =  200 * microsecond
s2_threshold   = 20.0
s2_holdon      = 100
s2_padding     = 200
